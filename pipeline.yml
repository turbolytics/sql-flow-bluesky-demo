# Counts Bluesky posts per minute by language in a 1-minute tumbling window and
# upserts each closed window into Postgres.
commands:
  # Logs and any timestamp rendering are UTC whatever the host's timezone.
  - name: pin the session timezone
    sql: |
      SET TimeZone='UTC';

  # Only the fields the handler reads. StructuredBatch loads each batch into
  # this table, so an unused field is parsing work for nothing.
  - name: declare the post schema
    sql: |
      CREATE TABLE IF NOT EXISTS posts (
        time_us BIGINT,
        commit STRUCT(
          operation TEXT,
          record STRUCT(langs TEXT[])
        )
      );

tables:
  sql:
    - name: posts_per_minute_by_lang
      # No unique index, on purpose. In-memory DuckDB never frees rows deleted
      # from an indexed table, and the engine deletes every closed minute, so
      # the index grew the worker from 100 MB to 450 MB in a day on a 512 MB
      # plan. Without it, each batch appends its own counts and emit_sql sums
      # them per minute. Measured flat over eight hours.
      # See turbolytics/sql-flow#268.
      sql: |
        CREATE TABLE IF NOT EXISTS posts_per_minute_by_lang (
          bucket TIMESTAMPTZ,
          lang TEXT,
          posts INTEGER
        );

      # sqlflow closes each minute against an event-time watermark: the newest
      # minute the data has reached, less the grace. A minute closes once the
      # stream has moved grace_seconds past its end, so the result is the same
      # whether the data arrives live or as a replay. The one wall-clock rule
      # is the idle bound: after idle_close_seconds with no batch arriving,
      # every open minute closes, so a quiet stream still publishes its last
      # minute.
      #
      # The grace outlives the batch wait on purpose. A batch is written when
      # it fills or after flush_interval_seconds, so an event from the last
      # seconds of a minute can reach DuckDB up to that long after the minute
      # ended.
      #
      # late_rows is drop, not reemit. A late row belongs to a minute that
      # already closed, and that minute's other rows are already deleted from
      # DuckDB. reemit publishes only the late rows, and the upsert below
      # replaces the minute's count with theirs: in a local run, one late post
      # turned a published count of 5 into 1. drop discards the row, logs
      # "dropped late rows", and counts it in window_late_rows_total.
      # sqlflow validate refuses reemit with an upserting postgres sink.
      window:
        time_column: bucket
        size_seconds: 60
        grace_seconds: 60
        idle_close_seconds: 60
        late_rows: drop
        poll_interval_seconds: 10
        # One row per minute and language. The table holds one row per batch,
        # so a minute's count is the sum of them. The sink keeps only the last
        # row it is handed for a key, so an unsummed minute would publish one
        # batch's count.
        emit_sql: |
          SELECT bucket, lang, sum(posts)::INTEGER AS posts
          FROM closed
          GROUP BY bucket, lang

        sink:
          # The postgres sink writes each closed minute at the cost of the
          # minute: a COPY into a session temp table, then a server-side
          # INSERT ... ON CONFLICT (bucket, lang) DO UPDATE, in one
          # transaction.
          #
          # It replaces a sqlcommand upsert through the DuckDB postgres
          # extension, which grew the worker's memory on every flush. The
          # extension does not send ON CONFLICT to Postgres: it copies the key
          # columns of the whole target table into DuckDB and resolves the
          # conflict there. This table gains a row per language every minute
          # and is never trimmed, so each flush read more than the last.
          # Measured in turbolytics/sql-flow#290.
          #
          # upsert on the primary key is what makes at-least-once delivery
          # survivable. A minute can reach Postgres twice: the sink retries a
          # write that timed out, which may already have landed, and a close
          # whose delete conflicts with the pipeline rolls back and publishes
          # the minute again. The second write replaces the first. The sink
          # checks at startup that a unique index covers exactly the key.
          #
          # updated_at is not in the batch. The insert names only the batch's
          # columns, so a new minute takes the column's DEFAULT now() from the
          # Postgres clock, and a republished minute keeps the time of its
          # first write.
          type: postgres
          postgres:
            # No default: a worker without a database must fail at startup,
            # not write to some other host.
            dsn: "{{ SQLFLOW_POSTGRES_URI }}"
            table: posts_per_minute_by_lang
            mode: upsert
            key: [bucket, lang]

pipeline:
  name: bluesky-posts-per-minute-by-lang
  # Reports this instance to a control plane when
  # SQLFLOW_TURBOSTATS_REPORT_TO is set, signed with SQLFLOW_TURBOSTATS_KEY.
  # Empty, the default, reports nowhere. The values are quoted so an unset
  # variable renders as an empty string, which the pipeline schema reads as
  # off, and not as null, which it rejects. Needs SQLFlow v2026.09.21 or later.
  turbostats:
    id: "{{ SQLFLOW_TURBOSTATS_ID|default('sqlflow-bluesky') }}"
    report_to: "{{ SQLFLOW_TURBOSTATS_REPORT_TO|default('') }}"
    key: "{{ SQLFLOW_TURBOSTATS_KEY|default('') }}"

  batch_size: 500

  source:
    type: websocket
    websocket:
      uri: "{{ SQLFLOW_JETSTREAM_URI|default('wss://jetstream2.us-east.bsky.network/subscribe?wantedCollections=app.bsky.feed.post') }}"

  handler:
    type: handlers.StructuredBatch
    table: posts
    sql: |
      INSERT INTO posts_per_minute_by_lang
      SELECT
        -- to_timestamp yields TIMESTAMPTZ, so the bucket is an instant and the
        -- write into a Postgres TIMESTAMPTZ column needs no interpretation. The
        -- example's date_trunc(make_timestamp(time_us)) yields a naive
        -- TIMESTAMP, and Postgres reads a naive value in the session timezone.
        time_bucket(INTERVAL '1 minute', to_timestamp(time_us / 1000000)) AS bucket,
        coalesce(commit.record.langs[1], 'unknown') AS lang,
        count(*) AS posts
      FROM posts
      WHERE commit.operation = 'create'
      GROUP BY bucket, lang

  # The window's sink does the writing. A pipeline sink would write every
  # batch, which is the opposite of aggregating.
  sink:
    type: noop
