# Serves the rollups the pipeline writes, read-only, from the same Postgres.
#
#   sqlflow serve -c serve.yml
#
# SQLFLOW_POSTGRES_URI              required
# SQLFLOW_SERVE_TOKEN_BLUESKY_DEMO  required. The page's client id. The name
#                                   predates client ids and stays: Render
#                                   minted the value under it, and a renamed
#                                   key would mint another.
# SQLFLOW_SERVE_PORT                default 8080
# SQLFLOW_TURBOSTATS_REPORT_TO    optional. A control plane's report URL, such
#                                 as https://ingest.turbolytics.io/v1/turbostats.
#                                 Empty, the default, reports nowhere.
# SQLFLOW_TURBOSTATS_KEY          required with a report URL: the credential
#                                 the control plane issued
# SQLFLOW_TURBOSTATS_ID           default sqlflow-bluesky-api
commands:
  - name: pin the session timezone
    sql: |
      SET TimeZone='UTC';

  - name: load postgres extension
    sql: |
      INSTALL postgres;
      LOAD postgres;

  # One scan fans out across ctid ranges, each on its own Postgres connection.
  # The default cap is 64. The Render plan allows far fewer.
  - name: bound the postgres connections one scan may open
    sql: |
      SET pg_connection_limit = 4;

  # READ_ONLY is the guard. A write in a dataset's SQL fails at startup, not in
  # the table.
  - name: attach postgres
    sql: |
      ATTACH '{{ SQLFLOW_POSTGRES_URI }}' AS pg (TYPE POSTGRES, READ_ONLY);

serve:
  name: bluesky-demo-api

  # Reports this instance to a control plane when
  # SQLFLOW_TURBOSTATS_REPORT_TO is set, signed with SQLFLOW_TURBOSTATS_KEY.
  # Empty, the default, reports nowhere. The values are quoted so an unset
  # variable renders as an empty string, which the serve schema reads as
  # off, and not as null, which it rejects. Needs SQLFlow v2026.09.21 or later.
  turbostats:
    id: "{{ SQLFLOW_TURBOSTATS_ID|default('sqlflow-bluesky-api') }}"
    report_to: "{{ SQLFLOW_TURBOSTATS_REPORT_TO|default('') }}"
    key: "{{ SQLFLOW_TURBOSTATS_KEY|default('') }}"

  http:
    addr: "0.0.0.0:{{ SQLFLOW_SERVE_PORT|default('8080') }}"
    cors:
      allowed_origins:
        - https://turbolytics.io
        - https://www.turbolytics.io

  clients:
    # An identifier, not a secret: the page ships it in its JS and sends it as
    # ?client_id=. It exists so the log names the caller and so the value can
    # be rotated.
    - name: bluesky-demo-page
      id: "{{ SQLFLOW_SERVE_TOKEN_BLUESKY_DEMO }}"

  # Four requests answer at once. Measured in the release image on Linux: four
  # concurrent sessions peak at 72 MiB resident on the demo's widest permitted
  # request, well inside this service's 512 MB. Eight bought no more
  # throughput than four on a controlled A/B, which is why 4 is the default.
  pool:
    size: 4

  # /metrics on the same listener, without a client id. The labels name the
  # datasets, which /v1/datasets already publishes, and no row data is in it.
  # sqlflow_serve_session_wait_seconds is what says whether the pool is the
  # limit under load.
  metrics:
    enabled: true

  limits:
    max_rows: 10000
    timeout_seconds: 10

  datasets:
    - name: pipeline_status
      # One row that every tab asks for on every refresh. Fifteen seconds is
      # small beside the seventy the pipeline already runs behind.
      cache: {ttl_seconds: 15}
      description: First and latest minute, last write, minutes observed, total posts. One row.
      sql: |
        SELECT first_bucket, latest_bucket, last_write_at,
               minutes_observed, total_posts
        FROM pg.pipeline_status

    # Generated by `sqlflow rollup serve -c rollups.yml`; `make rollups` prints it.
    # Edit rollups.yml and regenerate: CI's `sqlflow rollup check` fails on a
    # hand edit. Each grain reads a rollup table 0005's triggers keep current,
    # 1m reads the minute table, and the server picks the finest grain whose
    # max_range covers the requested range.
    #
    # cache and each grain's bucket come from rollups.yml too. since and until
    # are rounded up to the bucket, so every tab asking for "the last 24 hours"
    # inside one five-minute window asks one question and costs one query.
    # That is exact only because this SQL compares the bucket column
    # half-open; see the sqlflow README before caching a hand-written dataset.
    - name: posts_by_lang
      description: Posts per bucket per language. The top languages by posts over the range keep their own series and the rest sum into lang "other"; top sets how many, default 10, between 1 and 20. since and until bound the range, default the last 24 hours, and pick the grain. lang returns one language, never folded.
      params:
        - name: since
          type: timestamp
        - name: until
          type: timestamp
        - name: lang
          type: string
        - name: top
          type: integer
          min: 1
          max: 20
      cache:
        ttl_seconds: 30
      grains:
        1d:
          bucket: 1d
          cache:
            ttl_seconds: 600
          max_range: 365d
          sql: |
            SELECT bucket,
                   CASE WHEN lang_rank <= coalesce($top, 10) THEN lang ELSE 'other' END AS lang,
                   sum(posts)::BIGINT AS posts
            FROM (
              SELECT bucket, lang, posts,
                     dense_rank() OVER (ORDER BY lang_total DESC, lang) AS lang_rank
              FROM (
                SELECT bucket, lang, posts, sum(posts) OVER (PARTITION BY lang) AS lang_total
                FROM pg.posts_by_lang_1d
                WHERE bucket >= $since AND bucket < $until
                  AND lang = coalesce($lang, lang)
              )
            )
            GROUP BY ALL
            ORDER BY bucket, lang
        1h:
          bucket: 1h
          cache:
            ttl_seconds: 120
          max_range: 14d
          sql: |
            SELECT bucket,
                   CASE WHEN lang_rank <= coalesce($top, 10) THEN lang ELSE 'other' END AS lang,
                   sum(posts)::BIGINT AS posts
            FROM (
              SELECT bucket, lang, posts,
                     dense_rank() OVER (ORDER BY lang_total DESC, lang) AS lang_rank
              FROM (
                SELECT bucket, lang, posts, sum(posts) OVER (PARTITION BY lang) AS lang_total
                FROM pg.posts_by_lang_1h
                WHERE bucket >= $since AND bucket < $until
                  AND lang = coalesce($lang, lang)
              )
            )
            GROUP BY ALL
            ORDER BY bucket, lang
        1m:
          bucket: 1m
          max_range: 6h
          sql: |
            SELECT bucket,
                   CASE WHEN lang_rank <= coalesce($top, 10) THEN lang ELSE 'other' END AS lang,
                   sum(posts)::BIGINT AS posts
            FROM (
              SELECT bucket, lang, posts,
                     dense_rank() OVER (ORDER BY lang_total DESC, lang) AS lang_rank
              FROM (
                SELECT bucket, lang, posts, sum(posts) OVER (PARTITION BY lang) AS lang_total
                FROM pg.posts_per_minute_by_lang
                WHERE bucket >= $since AND bucket < $until
                  AND lang = coalesce($lang, lang)
              )
            )
            GROUP BY ALL
            ORDER BY bucket, lang
        5m:
          bucket: 5m
          max_range: 1d
          sql: |
            SELECT bucket,
                   CASE WHEN lang_rank <= coalesce($top, 10) THEN lang ELSE 'other' END AS lang,
                   sum(posts)::BIGINT AS posts
            FROM (
              SELECT bucket, lang, posts,
                     dense_rank() OVER (ORDER BY lang_total DESC, lang) AS lang_rank
              FROM (
                SELECT bucket, lang, posts, sum(posts) OVER (PARTITION BY lang) AS lang_total
                FROM pg.posts_by_lang_5m
                WHERE bucket >= $since AND bucket < $until
                  AND lang = coalesce($lang, lang)
              )
            )
            GROUP BY ALL
            ORDER BY bucket, lang
        6h:
          bucket: 6h
          cache:
            ttl_seconds: 300
          max_range: 90d
          sql: |
            SELECT bucket,
                   CASE WHEN lang_rank <= coalesce($top, 10) THEN lang ELSE 'other' END AS lang,
                   sum(posts)::BIGINT AS posts
            FROM (
              SELECT bucket, lang, posts,
                     dense_rank() OVER (ORDER BY lang_total DESC, lang) AS lang_rank
              FROM (
                SELECT bucket, lang, posts, sum(posts) OVER (PARTITION BY lang) AS lang_total
                FROM pg.posts_by_lang_6h
                WHERE bucket >= $since AND bucket < $until
                  AND lang = coalesce($lang, lang)
              )
            )
            GROUP BY ALL
            ORDER BY bucket, lang
        15m:
          bucket: 15m
          max_range: 3d
          sql: |
            SELECT bucket,
                   CASE WHEN lang_rank <= coalesce($top, 10) THEN lang ELSE 'other' END AS lang,
                   sum(posts)::BIGINT AS posts
            FROM (
              SELECT bucket, lang, posts,
                     dense_rank() OVER (ORDER BY lang_total DESC, lang) AS lang_rank
              FROM (
                SELECT bucket, lang, posts, sum(posts) OVER (PARTITION BY lang) AS lang_total
                FROM pg.posts_by_lang_15m
                WHERE bucket >= $since AND bucket < $until
                  AND lang = coalesce($lang, lang)
              )
            )
            GROUP BY ALL
            ORDER BY bucket, lang
      range:
        since: since
        until: until
        default: 24h
