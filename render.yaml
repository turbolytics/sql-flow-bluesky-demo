# Render Blueprint: a background worker streaming Jetstream into Postgres, and
# a web service serving the rollups over HTTP from the same image.
#
# The database is not declared here. It already exists, and a Blueprint entry
# with a matching name would apply this file's settings to it, including a
# plan and major version. fromDatabase may reference a database outside the
# Blueprint as long as it exists in the workspace. To deploy this elsewhere,
# create a Postgres named sqlflow-demo-rollups in the same region, or change
# the name below.
services:
  - type: worker
    name: sqlflow-bluesky
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 55 MiB resident at steady state, measured locally at ~44 messages/sec.
    plan: 0.5c-512mb
    # The database's region. connectionString is the private-network URL,
    # reachable only from services in the same region. Also the closest region
    # to jetstream2.us-east.
    region: virginia
    # Deploy only after CI passes. CI applies the migrations twice, so a
    # migration that is not idempotent never reaches the worker's entrypoint.
    autoDeployTrigger: checksPass
    envVars:
      # The private connection string. It never leaves Render and is never
      # committed.
      - key: SQLFLOW_POSTGRES_URI
        fromDatabase:
          name: sqlflow-demo-rollups
          property: connectionString
      - key: SQLFLOW_LOG_LEVEL
        value: INFO

  # The API. Only a web service gets a public URL, and the worker's job is to
  # never stop streaming, so HTTP is a second service rather than part of it.
  - type: web
    name: sqlflow-bluesky-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/bin/serve.sh
    plan: 0.5c-512mb
    # The database's region, for the private connection string.
    region: virginia
    # sqlflow serve answers /healthz from its DuckDB connection, without a
    # token.
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: SQLFLOW_POSTGRES_URI
        fromDatabase:
          name: sqlflow-demo-rollups
          property: connectionString
      # Render mints the token once, when the service is created. It is an
      # identity the page ships in its JS, not a secret. Copy it from the
      # dashboard into the page; rotate it by editing the variable.
      - key: SQLFLOW_SERVE_TOKEN_BLUESKY_DEMO
        generateValue: true
      # serve.yml listens on SQLFLOW_SERVE_PORT. PORT tells Render the same
      # port, so it routes there rather than scanning for one.
      - key: SQLFLOW_SERVE_PORT
        value: "8080"
      - key: PORT
        value: "8080"
      - key: SQLFLOW_LOG_LEVEL
        value: INFO
