# Render Blueprint: a Postgres, a private service streaming Jetstream into it,
# a web service serving the rollups over HTTP from the same image, a second
# private service checking that those rollups match what they are built from,
# and a third watching the database itself for control.
#
# Everything the demo needs is declared here, so the Deploy to Render button in
# the README works in a workspace that has none of it. fromDatabase may
# reference a database outside the Blueprint, but only one that already exists
# in that workspace, which is never true for someone deploying their own copy.
#
# The database below is the one already running this demo. A Blueprint entry
# whose name matches an existing resource adopts it and applies these settings
# to it, so every field here is the live database's current value, read from
# the dashboard on 2026-09-17. Changing one changes production on the next
# sync. Storage in particular cannot be decreased.
databases:
  - name: sqlflow-demo-rollups
    plan: 0.1c-256mb
    # Same region as both services: connectionString is the private-network
    # URL, which only resolves within one region.
    region: virginia
    postgresMajorVersion: "18"
    diskSizeGB: 5
    # Off, as it is on the live database. The demo writes about 33 rows a
    # minute and nothing is deleted yet, so storage is worth watching rather
    # than growing silently.
    storageAutoscalingEnabled: false

services:
  # A Blueprint matches an existing resource by name and type, and these
  # services were created by hand before this file existed. Where the two
  # disagreed, Render offered to create a second pipeline beside the live one --
  # both consuming Jetstream, both upserting the same minute -- rather than
  # adopting it. The live service was renamed to the name below; -pipeline,
  # -api and -rollups now say what each one does.
  #
  # pserv rather than worker, and not only to match. A worker cannot open a
  # port, and the engine's /metrics is the only place
  # messages_unplaceable_total is readable. A release that refused 82% of posts
  # passed every config check this repository had; the counter that would have
  # named it in a second is on :8000.
  - type: pserv
    name: sqlflow-bluesky-pipeline
    runtime: docker
    dockerfilePath: ./Dockerfile
    # The entrypoint passes its arguments through to sqlflow run. Without
    # --metrics nothing listens, and a private service with no open port is a
    # service Render has no address for.
    dockerCommand: /app/bin/entrypoint.sh --metrics prometheus
    # 55 MiB resident at steady state, measured locally at ~44 messages/sec.
    plan: 0.5c-512mb
    # The database's region. connectionString is the private-network URL,
    # reachable only from services in the same region. Also the closest region
    # to jetstream2.us-east.
    region: virginia
    # Off rather than checksPass: this file is also what the README's Deploy to
    # Render button applies, and a copy of it in someone else's workspace would
    # otherwise redeploy whenever this repository's main moves.
    #
    # This gives up a gate. CI applies the migrations twice, and under
    # checksPass a migration that is not idempotent could never reach the
    # worker's entrypoint. CI still runs that check; it is now on whoever
    # deploys to read it first.
    #
    # Quoted: unquoted, YAML reads off as the boolean false, and Render's
    # schema wants one of the three trigger names.
    autoDeployTrigger: "off"
    envVars:
      # The private connection string. It never leaves Render and is never
      # committed.
      - key: SQLFLOW_POSTGRES_URI
        fromDatabase:
          name: sqlflow-demo-rollups
          property: connectionString
      - key: SQLFLOW_LOG_LEVEL
        value: INFO

  # The API. Only a web service gets a public URL, and the worker's job is to
  # never stop streaming, so HTTP is a second service rather than part of it.
  - type: web
    name: sqlflow-bluesky-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/bin/serve.sh
    plan: 0.5c-512mb
    # The database's region, for the private connection string.
    region: virginia
    # sqlflow serve answers /healthz from its DuckDB connection, without a
    # client id.
    healthCheckPath: /healthz
    # As on the worker above.
    autoDeployTrigger: "off"
    envVars:
      - key: SQLFLOW_POSTGRES_URI
        fromDatabase:
          name: sqlflow-demo-rollups
          property: connectionString
      # The page's client id, sent as ?client_id=. Render mints it once, when
      # the service is created. It is an identifier the page ships in its JS,
      # not a secret. Copy it from the dashboard into the page; rotate it by
      # editing the variable. The key keeps its old name on purpose: a renamed
      # generateValue key mints a new value, and the deployed page's id would
      # stop matching.
      - key: SQLFLOW_SERVE_TOKEN_BLUESKY_DEMO
        generateValue: true
      # serve.yml listens on SQLFLOW_SERVE_PORT. PORT tells Render the same
      # port, so it routes there rather than scanning for one.
      - key: SQLFLOW_SERVE_PORT
        value: "8080"
      - key: PORT
        value: "8080"
      - key: SQLFLOW_LOG_LEVEL
        value: INFO

  # The rollup supervisor. It does not maintain the rollups: the triggers
  # migrations/0005_rollups.sql installs do that, in the writing transaction,
  # and they keep doing it whether this service runs or not. What it adds is
  # everything around the merge -- it backfills history a table is missing,
  # recomputes every bucket against the table below it on a loop, and reports
  # what differs. So losing it is not an incident: the numbers stay right and
  # only the checking stops.
  #
  # It adopts what the migrations already built. `rollup install` compares each
  # table's columns against what rollups.yml declares and records the
  # declaration in sqlflow_rollup_state; it issues only CREATE IF NOT EXISTS
  # and CREATE OR REPLACE, so it cannot drop or empty a table that holds
  # history. A table whose columns disagree aborts the whole transaction and
  # exits non-zero rather than changing anything.
  # pserv, like the pipeline: bin/rollups.sh already serves /healthz and
  # rollup_drift_buckets on :8000, and reporting drift to nowhere is the one
  # thing this service must not do.
  - type: pserv
    name: sqlflow-bluesky-rollups
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Overrides the image's entrypoint, which would start a second pipeline.
    # bin/rollups.sh applies the migrations first: `rollup install` exits
    # non-zero when the minute table is not there yet, and nothing orders one
    # service ahead of another on a first deploy.
    dockerCommand: /app/bin/rollups.sh
    # 22 MiB resident measured locally, idle at 0% CPU between passes: the
    # backfill is chunked and a verify pass reads a few buckets. Far more than
    # this needs, and also the smallest plan there is -- Render's schema offers
    # nothing below 0.5c-512mb for a service.
    plan: 0.5c-512mb
    # The database's region, for the private connection string.
    region: virginia
    # As on the services above.
    autoDeployTrigger: "off"
    envVars:
      # rollups.yml templates store.postgres.dsn from this. Two connections,
      # leader or standby: one holds the leader lock, one does the work.
      - key: SQLFLOW_POSTGRES_URI
        fromDatabase:
          name: sqlflow-demo-rollups
          property: connectionString
      - key: SQLFLOW_LOG_LEVEL
        value: INFO

  # dbhealth, watching the database for control. The engine reports its own
  # state over TurboStats; nothing reported the database's -- whether it
  # answers and how fast, how many of its connections are in use, how big it
  # is, how old the minute table's newest row is. dbhealth reads those once a
  # minute over the same private-network URL as the services above and
  # reports them to https://ingest.turbolytics.io, where control shows the
  # database beside the pipeline writing to it.
  #
  # The published image, pinned by tag in dbhealth/Dockerfile, with the
  # demo's config: the tables it watches are named there, each with its
  # freshness column, since the rollups keep their time in `bucket`. A
  # change outside dbhealth/ does not rebuild it. pserv, as above: dbhealth
  # serves /metrics and /healthz on :8000.
  - type: pserv
    name: sqlflow-bluesky-dbhealth
    runtime: docker
    dockerfilePath: ./dbhealth/Dockerfile
    dockerContext: ./dbhealth
    buildFilter:
      paths:
        - dbhealth/**
    # 20 MiB resident: one SELECT 1 and six catalog reads a minute. The
    # smallest plan there is.
    plan: 0.5c-512mb
    # The database's region, for the private connection string.
    region: virginia
    envVars:
      # The private connection string. dbhealth keeps it in the process;
      # what it reports is host:port/database.
      - key: DBHEALTH_DSN
        fromDatabase:
          name: sqlflow-demo-rollups
          property: connectionString
      # Your org's credential from https://control.turbolytics.io. sync:
      # false: Render asks for it in the dashboard when the Blueprint is
      # applied and never writes it back here. Required: the config reports
      # to Control, and dbhealth refuses to start without it.
      - key: DBHEALTH_KEY
        sync: false
