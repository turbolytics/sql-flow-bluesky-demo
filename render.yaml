# Render Blueprint: a Postgres, a background worker streaming Jetstream into
# it, and a web service serving the rollups over HTTP from the worker's image.
#
# Everything the demo needs is declared here, so the Deploy to Render button in
# the README works in a workspace that has none of it. fromDatabase may
# reference a database outside the Blueprint, but only one that already exists
# in that workspace, which is never true for someone deploying their own copy.
#
# The database below is the one already running this demo. A Blueprint entry
# whose name matches an existing resource adopts it and applies these settings
# to it, so every field here is the live database's current value, read from
# the dashboard on 2026-09-17. Changing one changes production on the next
# sync. Storage in particular cannot be decreased.
databases:
  - name: sqlflow-demo-rollups
    plan: 0.1c-256mb
    # Same region as both services: connectionString is the private-network
    # URL, which only resolves within one region.
    region: virginia
    postgresMajorVersion: "18"
    diskSizeGB: 5
    # Off, as it is on the live database. The demo writes about 33 rows a
    # minute and nothing is deleted yet, so storage is worth watching rather
    # than growing silently.
    storageAutoscalingEnabled: false

services:
  - type: worker
    name: sqlflow-bluesky
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 55 MiB resident at steady state, measured locally at ~44 messages/sec.
    plan: 0.5c-512mb
    # The database's region. connectionString is the private-network URL,
    # reachable only from services in the same region. Also the closest region
    # to jetstream2.us-east.
    region: virginia
    # Off rather than checksPass: this file is also what the README's Deploy to
    # Render button applies, and a copy of it in someone else's workspace would
    # otherwise redeploy whenever this repository's main moves.
    #
    # This gives up a gate. CI applies the migrations twice, and under
    # checksPass a migration that is not idempotent could never reach the
    # worker's entrypoint. CI still runs that check; it is now on whoever
    # deploys to read it first.
    #
    # Quoted: unquoted, YAML reads off as the boolean false, and Render's
    # schema wants one of the three trigger names.
    autoDeployTrigger: "off"
    envVars:
      # The private connection string. It never leaves Render and is never
      # committed.
      - key: SQLFLOW_POSTGRES_URI
        fromDatabase:
          name: sqlflow-demo-rollups
          property: connectionString
      - key: SQLFLOW_LOG_LEVEL
        value: INFO

  # The API. Only a web service gets a public URL, and the worker's job is to
  # never stop streaming, so HTTP is a second service rather than part of it.
  - type: web
    name: sqlflow-bluesky-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/bin/serve.sh
    plan: 0.5c-512mb
    # The database's region, for the private connection string.
    region: virginia
    # sqlflow serve answers /healthz from its DuckDB connection, without a
    # client id.
    healthCheckPath: /healthz
    # As on the worker above.
    autoDeployTrigger: "off"
    envVars:
      - key: SQLFLOW_POSTGRES_URI
        fromDatabase:
          name: sqlflow-demo-rollups
          property: connectionString
      # The page's client id, sent as ?client_id=. Render mints it once, when
      # the service is created. It is an identifier the page ships in its JS,
      # not a secret. Copy it from the dashboard into the page; rotate it by
      # editing the variable. The key keeps its old name on purpose: a renamed
      # generateValue key mints a new value, and the deployed page's id would
      # stop matching.
      - key: SQLFLOW_SERVE_TOKEN_BLUESKY_DEMO
        generateValue: true
      # serve.yml listens on SQLFLOW_SERVE_PORT. PORT tells Render the same
      # port, so it routes there rather than scanning for one.
      - key: SQLFLOW_SERVE_PORT
        value: "8080"
      - key: PORT
        value: "8080"
      - key: SQLFLOW_LOG_LEVEL
        value: INFO
