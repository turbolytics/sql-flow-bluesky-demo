# The rollups Postgres keeps from the pipeline's minute table, and the dataset
# the API serves from them.
#
#   make rollups    regenerates migrations/0005_rollups.sql and prints the
#                   posts_by_lang dataset for serve.yml
#
# CI runs `sqlflow rollup check`, which fails when either generated file
# differs from what this file generates.

# Where the rollup tables live. `rollup install`, `rollup run` and `rollup
# verify` read this; `ddl`, `serve` and `check` never connect and ignore it, so
# CI validates this file with the variable unset and gets a warning rather than
# a failure, as it already does for serve.yml.
#
# The same variable the worker and the API read. Only SQLFLOW_-prefixed
# variables reach a config template.
store:
  type: postgres
  postgres:
    dsn: "{{ SQLFLOW_POSTGRES_URI }}"

# Reports `rollup run` to a control plane when SQLFLOW_TURBOSTATS_REPORT_TO is
# set, signed with SQLFLOW_TURBOSTATS_KEY. Empty, the default, reports nowhere.
# The values are quoted so an unset variable renders as an empty string, which
# reads as off. A file that reports declares at most 10 tables, and this one
# declares exactly 10: two dimension sets at five grains. Needs SQLFlow
# v2026.09.27 or later.
turbostats:
  id: "{{ SQLFLOW_TURBOSTATS_ID|default('sqlflow-bluesky-rollups') }}"
  report_to: "{{ SQLFLOW_TURBOSTATS_REPORT_TO|default('') }}"
  key: "{{ SQLFLOW_TURBOSTATS_KEY|default('') }}"

rollups:
  - name: posts
    source:
      table: posts_per_minute_by_lang
      time_column: bucket
      grain: 1m
      dimensions: [lang]

    # Each grain a few times the one below it, so a re-merge reads few rows
    # and a chart that crosses to the next grain keeps its shape.
    grains:
      5m: {from: 1m}
      15m: {from: 5m}
      1h: {from: 15m}
      6h: {from: 1h}
      1d: {from: 6h}

    dimension_sets:
      - name: posts_by_lang
        dimensions: [lang]
        measures:
          posts: {type: sum, column: posts}
      # One row per bucket: pipeline_status reads its totals and minutes
      # observed from here instead of scanning the minute table.
      - name: posts_total
        dimensions: []
        measures:
          posts: {type: sum, column: posts}
          minutes: {type: count_buckets}

    serve:
      catalog: pg
      # About 300 points per chart. 365 buckets × 21 series (top 20 and
      # other) stays under max_rows 10000.
      max_buckets: 365
      datasets:
        - name: posts_by_lang
          dimension_set: posts_by_lang
          description: >-
            Posts per bucket per language. The top languages by posts over the
            range keep their own series and the rest sum into lang "other";
            top sets how many, default 10, between 1 and 20. since and until
            bound the range, default the last 24 hours, and pick the grain.
            lang returns one language, never folded.
          default_range: 24h
          # serve answers repeats of one question from memory for this long. The
          # page's tabs all ask the same question, a few milliseconds apart.
          cache_ttl_seconds: 30
          # The coarse grains change by one open bucket, and their key only
          # rolls over when a bucket that wide closes, so the TTL alone decides
          # how often the widest queries run.
          cache_ttl_by_grain: {1h: 120, 6h: 300, 1d: 600}
          max_range: {1m: 6h, 5m: 1d, 15m: 3d, 1h: 14d, 6h: 90d, 1d: 365d}
          fold: {dimension: lang, top: {default: 10, max: 20}}
          filters: {lang: lang}
