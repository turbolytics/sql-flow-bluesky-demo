name: ci

on:
  push:
  pull_request:

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the Render database's major version.
        image: postgres:18
        env:
          POSTGRES_USER: bluesky
          POSTGRES_PASSWORD: bluesky
          POSTGRES_DB: bluesky
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bluesky -d bluesky"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      SQLFLOW_POSTGRES_URI: postgresql://bluesky:bluesky@localhost:5432/bluesky
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        run: bin/migrate.sh | tee first.log

      - name: Every migration applied on the first run
        run: |
          if grep -q '^skipped ' first.log; then
            echo "a migration was skipped on an empty database" >&2
            exit 1
          fi
          grep -q '^applied ' first.log

      - name: Apply migrations again
        run: bin/migrate.sh | tee second.log

      # The check that matters: a non-idempotent migration passes its first
      # deploy and crashes the worker on its second.
      - name: Nothing applied on the second run
        run: |
          if grep -q '^applied ' second.log; then
            echo "a migration applied twice" >&2
            exit 1
          fi
          grep -q '^skipped ' second.log

      # The failure a Blueprint's first deploy hits and no other path does.
      # Render resolves fromDatabase as soon as the database record exists, but
      # the instance is not listening yet; psql exits 2 on the refused
      # connection and the deploy fails before a migration runs. Compose gates
      # on service_healthy and the service container above gates on pg_isready,
      # so only a Postgres started deliberately late can catch a regression.
      - name: Migrations wait for a database that is not up yet
        run: |
          port=5499
          export SQLFLOW_POSTGRES_URI="postgresql://bluesky:bluesky@127.0.0.1:$port/bluesky"
          bin/migrate.sh > race.log 2>&1 &
          migrate_pid=$!
          sleep 5
          docker run -d --name migrate-race -p "$port:5432" \
            -e POSTGRES_USER=bluesky -e POSTGRES_PASSWORD=bluesky \
            -e POSTGRES_DB=bluesky postgres:18
          if ! wait "$migrate_pid"; then
            echo "migrate.sh failed against a database that started late" >&2
            cat race.log >&2
            exit 1
          fi
          cat race.log
          grep -q '^applied ' race.log || { echo "no migration applied" >&2; exit 1; }
          docker rm -f migrate-race

      # Waiting must be bounded. A script that blocks forever on an unreachable
      # database turns a failed deploy into a deploy that never finishes.
      - name: Waiting for the database gives up rather than hanging
        run: |
          status=0
          SQLFLOW_MIGRATE_WAIT_SECONDS=5 \
            SQLFLOW_POSTGRES_URI="postgresql://bluesky:bluesky@127.0.0.1:5598/bluesky" \
            bin/migrate.sh || status=$?
          if [ "$status" != 2 ]; then
            echo "expected status 2 from an unreachable database, got $status" >&2
            exit 1
          fi

      - name: The schema is what the demo page reads
        run: |
          psql "$SQLFLOW_POSTGRES_URI" -v ON_ERROR_STOP=1 -c "
            SELECT bucket, lang, posts, updated_at
            FROM posts_per_minute_by_lang WHERE false"
          psql "$SQLFLOW_POSTGRES_URI" -v ON_ERROR_STOP=1 -c "
            SELECT first_bucket, latest_bucket, last_write_at,
                   minutes_observed, total_posts
            FROM pipeline_status"
          for view in posts_per_5m_by_lang posts_per_hour_by_lang posts_per_day_by_lang; do
            psql "$SQLFLOW_POSTGRES_URI" -v ON_ERROR_STOP=1 -c "
              SELECT bucket, lang, posts FROM $view WHERE false"
          done
          for grain in 5m 15m 1h 6h 1d; do
            psql "$SQLFLOW_POSTGRES_URI" -v ON_ERROR_STOP=1 -c "
              SELECT bucket, lang, posts FROM posts_by_lang_$grain WHERE false"
            psql "$SQLFLOW_POSTGRES_URI" -v ON_ERROR_STOP=1 -c "
              SELECT bucket, minutes, posts FROM posts_total_$grain WHERE false"
          done

      # Two minutes either side of UTC midnight, written from a session in
      # Asia/Kolkata, so the write and its triggers both run in that zone. A
      # bucket expression that truncates in the session zone would put the day
      # at 18:30 UTC and the hour at :30. The API serves UTC buckets whatever
      # zone a writer or a DuckDB connection happens to open in.
      - name: The rollups bucket in UTC whatever the session zone
        run: |
          PGTZ=Asia/Kolkata psql "$SQLFLOW_POSTGRES_URI" -v ON_ERROR_STOP=1 -c "
            INSERT INTO posts_per_minute_by_lang (bucket, lang, posts) VALUES
              ('2026-09-10 23:59:00+00', 'en', 1),
              ('2026-09-11 00:04:00+00', 'en', 2)"
          got=$(PGTZ=Asia/Kolkata psql "$SQLFLOW_POSTGRES_URI" -v ON_ERROR_STOP=1 -tA -c "
            SELECT string_agg(grain || ' ' || to_char(bucket AT TIME ZONE 'UTC', 'YYYY-MM-DD HH24:MI') || ' ' || posts,
                              ', ' ORDER BY grain, bucket)
            FROM (
              SELECT '5m' AS grain, bucket, posts FROM posts_by_lang_5m
              UNION ALL SELECT '15m', bucket, posts FROM posts_by_lang_15m
              UNION ALL SELECT '1h', bucket, posts FROM posts_by_lang_1h
              UNION ALL SELECT '6h', bucket, posts FROM posts_by_lang_6h
              UNION ALL SELECT '1d', bucket, posts FROM posts_by_lang_1d
            ) AS v")
          want="15m 2026-09-10 23:45 1, 15m 2026-09-11 00:00 2, 1d 2026-09-10 00:00 1, 1d 2026-09-11 00:00 2, 1h 2026-09-10 23:00 1, 1h 2026-09-11 00:00 2, 5m 2026-09-10 23:55 1, 5m 2026-09-11 00:00 2, 6h 2026-09-10 18:00 1, 6h 2026-09-11 00:00 2"
          if [ "$got" != "$want" ]; then
            printf 'rollups bucket wrong\n got: %s\nwant: %s\n' "$got" "$want" >&2
            exit 1
          fi

      # The triggers keep every grain equal to the minute table, including a
      # minute republished with a new count, which the pipeline's at-least-once
      # writes produce. Deletes do not propagate, so this runs before the
      # truncate below.
      - name: Every rollup equals the minute table
        run: |
          psql "$SQLFLOW_POSTGRES_URI" -v ON_ERROR_STOP=1 -c "
            INSERT INTO posts_per_minute_by_lang (bucket, lang, posts) VALUES
              ('2026-09-11 00:04:00+00', 'ja', 7),
              ('2026-09-11 06:30:00+00', 'en', 11)"
          psql "$SQLFLOW_POSTGRES_URI" -v ON_ERROR_STOP=1 -c "
            INSERT INTO posts_per_minute_by_lang (bucket, lang, posts)
            VALUES ('2026-09-11 00:04:00+00', 'en', 99)
            ON CONFLICT (bucket, lang) DO UPDATE SET posts = excluded.posts"
          for pair in 5m:'5 minutes' 15m:'15 minutes' 1h:'1 hour' 6h:'6 hours' 1d:'24 hours'; do
            grain=${pair%%:*}; width=${pair##*:}
            diff=$(psql "$SQLFLOW_POSTGRES_URI" -v ON_ERROR_STOP=1 -tA -c "
              WITH src AS (
                SELECT date_bin(INTERVAL '$width', bucket, TIMESTAMPTZ '2000-01-01 00:00:00+00') AS bucket,
                       lang, sum(posts)::bigint AS posts
                FROM posts_per_minute_by_lang GROUP BY 1, 2)
              SELECT count(*) FROM (
                (TABLE src EXCEPT SELECT bucket, lang, posts FROM posts_by_lang_$grain)
                UNION ALL
                (SELECT bucket, lang, posts FROM posts_by_lang_$grain EXCEPT TABLE src)) AS d")
            if [ "$diff" != "0" ]; then
              echo "posts_by_lang_$grain differs from the minute table in $diff rows" >&2
              exit 1
            fi
          done
          got=$(psql "$SQLFLOW_POSTGRES_URI" -v ON_ERROR_STOP=1 -tA -c "
            SELECT minutes_observed || ' ' || total_posts FROM pipeline_status")
          want=$(psql "$SQLFLOW_POSTGRES_URI" -v ON_ERROR_STOP=1 -tA -c "
            SELECT count(DISTINCT bucket) || ' ' || sum(posts) FROM posts_per_minute_by_lang")
          if [ "$got" != "$want" ]; then
            printf 'pipeline_status wrong\n got: %s\nwant: %s\n' "$got" "$want" >&2
            exit 1
          fi
          psql "$SQLFLOW_POSTGRES_URI" -v ON_ERROR_STOP=1 -c "TRUNCATE posts_per_minute_by_lang"

      # With sequential scans off, a view whose filter no index serves still
      # plans a Seq Scan. An index whose expression drifts from its view's
      # would pass every other check and scan the whole table on every request.
      - name: Each rollup view's range filter uses its index
        run: |
          for pair in posts_per_5m_by_lang:posts_per_minute_by_lang_5m_idx \
                      posts_per_hour_by_lang:posts_per_minute_by_lang_hour_idx \
                      posts_per_day_by_lang:posts_per_minute_by_lang_day_idx; do
            view=${pair%%:*}; index=${pair##*:}
            plan=$(psql "$SQLFLOW_POSTGRES_URI" -v ON_ERROR_STOP=1 -tA -c "
              SET enable_seqscan = off;
              EXPLAIN (COSTS OFF) SELECT bucket, lang, posts FROM $view
              WHERE bucket >= now() - INTERVAL '12 hours' AND bucket < now()")
            if ! grep -q "Index Scan on $index\|Index Scan using $index" <<<"$plan"; then
              printf '%s does not use %s:\n%s\n' "$view" "$index" "$plan" >&2
              exit 1
            fi
          done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # render.yaml is the one config no local run exercises: a mistake in it
      # surfaces as a failed Blueprint sync, against the live database. The
      # schema is fetched rather than pinned, so this also catches Render
      # renaming a plan or retiring a key under a file that still says the old
      # name.
      - name: Validate render.yaml
        run: |
          pip install --quiet jsonschema pyyaml
          python3 bin/validate-render.py render.yaml

      # The check above passes when the schema is empty, when the error walk
      # stops reporting, and when nobody notices it stopped checking. A copy
      # with a plan Render does not offer has to fail it, with the status that
      # means invalid: an unreachable schema exits 2 and rejects everything,
      # which would make this step pass while checking nothing.
      - name: The render.yaml check rejects a bad plan
        run: |
          sed 's/plan: 0.5c-512mb/plan: nonexistent-plan/' render.yaml > bogus.yaml
          status=0
          python3 bin/validate-render.py bogus.yaml || status=$?
          if [ "$status" != 1 ]; then
            echo "expected the bad plan to be rejected with status 1, got $status" >&2
            exit 1
          fi

      # Catches a config that no longer parses, which is the failure a pinned
      # image makes rare and a bumped image makes likely.
      - name: Validate pipeline.yml
        run: |
          docker run --rm -v "$PWD/pipeline.yml:/app/pipeline.yml" \
            turbolytics/sql-flow:v2026.09.19.1 validate /app/pipeline.yml

      # Without secrets: an unset token or URI is a warning, not a failure.
      - name: Validate serve.yml
        run: |
          docker run --rm -v "$PWD/serve.yml:/app/serve.yml" \
            turbolytics/sql-flow:v2026.09.19.1 validate /app/serve.yml

      - name: Validate rollups.yml
        run: |
          docker run --rm -v "$PWD/rollups.yml:/app/rollups.yml" \
            turbolytics/sql-flow:v2026.09.19.1 validate /app/rollups.yml

      # migrations/0005_rollups.sql and serve.yml's posts_by_lang dataset are
      # generated. This is what makes editing either by hand, or changing
      # rollups.yml without regenerating them, fail here rather than in
      # production.
      - name: The generated rollup files match rollups.yml
        run: |
          docker run --rm -v "$PWD:/w" -w /w turbolytics/sql-flow:v2026.09.19.1 \
            rollup check -c rollups.yml \
              --migration migrations/0005_rollups.sql --serve serve.yml

      # Render builds this Dockerfile on deploy. Building it here keeps a broken
      # image from passing the checks that gate the deploy.
      - name: Build the worker image
        run: docker build -t sqlflow-bluesky-demo .

  # The only place the API's attachment path runs end to end: the image,
  # bin/serve.sh, the migrations, DuckDB's Postgres extension and serve.yml's
  # SQL against real views. sql-flow's own tests run without Postgres.
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the Render database's major version.
        image: postgres:18
        env:
          POSTGRES_USER: bluesky
          POSTGRES_PASSWORD: bluesky
          POSTGRES_DB: bluesky
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bluesky -d bluesky"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      SQLFLOW_POSTGRES_URI: postgresql://bluesky:bluesky@localhost:5432/bluesky
      CLIENT_ID: ci-client
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t sqlflow-bluesky-demo .

      - name: Start the API
        run: |
          docker run -d --name api --network host \
            -e SQLFLOW_POSTGRES_URI \
            -e SQLFLOW_SERVE_TOKEN_BLUESKY_DEMO="$CLIENT_ID" \
            --entrypoint /app/bin/serve.sh sqlflow-bluesky-demo
          for _ in $(seq 1 60); do
            if curl -sf localhost:8080/healthz; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

      # Three minutes in one hour, two languages. With top=1 the fold keeps en
      # and sums ja into other; with lang=ja, ja comes back unfolded.
      - name: The API serves the rollups
        run: |
          fail() { echo "$1" >&2; docker logs api; exit 1; }
          hour=$(date -u -d '-2 hours' +%Y-%m-%dT%H:00:00Z)
          next=$(date -u -d "$hour +1 hour" +%Y-%m-%dT%H:00:00Z)
          psql "$SQLFLOW_POSTGRES_URI" -v ON_ERROR_STOP=1 -c "
            INSERT INTO posts_per_minute_by_lang (bucket, lang, posts) VALUES
              ('$hour'::timestamptz + INTERVAL '1 minute', 'en', 5),
              ('$hour'::timestamptz + INTERVAL '2 minutes', 'en', 7),
              ('$hour'::timestamptz + INTERVAL '1 minute', 'ja', 3)"

          # -G appends client_id to the query, after any the path already has.
          api() { curl -s -o body.json -w '%{http_code}' -G --data-urlencode "client_id=$CLIENT_ID" "localhost:8080/v1/datasets$1"; }

          [ "$(api '')" = 200 ] || fail "listing: $(cat body.json)"
          jq -e '[.datasets[].name] == ["pipeline_status", "posts_by_lang"]
                 and (.datasets[1].grains | keys) == ["15m", "1d", "1h", "1m", "5m", "6h"]
                 and .datasets[1].range.default == "24h"
                 and (.datasets[1].params[] | select(.name == "top") | .min == 1 and .max == 20)' body.json \
            || fail "listing: $(cat body.json)"

          [ "$(api "/posts_by_lang?grain=1h&top=1&since=$hour&until=$next")" = 200 ] || fail "1h: $(cat body.json)"
          jq -e --arg b "$hour" '.rows == [
                 {"bucket": $b, "lang": "en", "posts": 12},
                 {"bucket": $b, "lang": "other", "posts": 3}]' body.json \
            || fail "1h top=1: $(cat body.json)"

          [ "$(api "/posts_by_lang?grain=1h&lang=ja&since=$hour&until=$next")" = 200 ] || fail "1h ja: $(cat body.json)"
          jq -e --arg b "$hour" '.rows == [{"bucket": $b, "lang": "ja", "posts": 3}]' body.json \
            || fail "1h lang=ja: $(cat body.json)"

          [ "$(api '/pipeline_status')" = 200 ] || fail "status: $(cat body.json)"
          jq -e '.rows[0].total_posts == 15 and .rows[0].minutes_observed == 2' body.json \
            || fail "status: $(cat body.json)"

          # Without a grain the server picks one from the range: the default 24
          # hours is served by 5m, and two days by 15m. A page asks for a
          # window and gets the finest grain that covers it.
          [ "$(api '/posts_by_lang')" = 200 ] || fail "no grain: $(cat body.json)"
          jq -e '.grain == "5m" and (.rows | map(.posts) | add) == 15' body.json \
            || fail "no grain: $(cat body.json)"

          two_days_ago=$(date -u -d '-2 days' +%Y-%m-%dT%H:%M:%SZ)
          [ "$(api "/posts_by_lang?since=$two_days_ago")" = 200 ] || fail "2 days: $(cat body.json)"
          jq -e '.grain == "15m"' body.json || fail "2 days: $(cat body.json)"

          # A range wider than the named grain is refused rather than clamped,
          # and top outside its bounds is refused rather than clamped.
          week_ago=$(date -u -d '-7 days' +%Y-%m-%dT%H:%M:%SZ)
          [ "$(api "/posts_by_lang?grain=5m&since=$week_ago")" = 400 ] || fail "7d at 5m: $(cat body.json)"
          jq -e '.error.code == "range_too_wide"' body.json || fail "7d at 5m: $(cat body.json)"

          [ "$(api '/posts_by_lang?top=21')" = 400 ] || fail "top=21: $(cat body.json)"
          jq -e '.error.code == "invalid_param" and (.error.message | contains("between 1 and 20"))' body.json \
            || fail "top=21: $(cat body.json)"

          code=$(curl -s -o body.json -w '%{http_code}' localhost:8080/v1/datasets/pipeline_status)
          [ "$code" = 401 ] || fail "no client id: $code $(cat body.json)"

          # The deployed page sends the deprecated bearer header until it moves
          # to client_id. Delete this check with the sqlflow release that
          # refuses the header.
          code=$(curl -s -o body.json -w '%{http_code}' -H "Authorization: Bearer $CLIENT_ID" localhost:8080/v1/datasets/pipeline_status)
          [ "$code" = 200 ] || fail "bearer header: $code $(cat body.json)"

      - name: API logs
        if: always()
        run: docker logs api || true
